# 定期将 workers-world org 各仓 Cloudflare 相关 npm 依赖升至 peer 兼容版本并开 PR（WW-239 兼容闸）。
# Gate N1: 开 PR 后启用 squash auto-merge + fleet:ready；destin 检查全绿后无人值守合并。
# 同 schedule 关闭 DIRTY / behind / 被较新 bump head 取代的 npm-deps PR（disposition: superseded）。
# Linear WW-239 / WW-49 · GitHub workers-world/worker-support-action#27
name: Bump Cloudflare npm deps

on:
  schedule:
    - cron: "0 5 * * 1"   # 每周一 05:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: "仅处理单个仓名（留空则扫描全 org）"
        required: false
        type: string
      dry_run:
        description: "只打印将开的 PR，不推送"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm/yarn lockfiles)
        run: corepack enable

      - name: Bump org Cloudflare npm deps and open PRs
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GHA_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::secrets.GHA_TOKEN is required to clone private workers-world repos, authenticate to GitHub Packages, and open PRs (GITHUB_TOKEN cannot access them in this job)." >&2
            exit 1
          fi
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--remote --apply)
          if [[ -n "${{ inputs.repo }}" ]]; then
            args+=(--repo "${{ inputs.repo }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash bump-cloudflare-dependencies/bump-cloudflare-npm-deps.sh "${args[@]}" | tee bump-cloudflare-deps.log

      - name: Close superseded / dirty npm-deps PRs (Gate N1)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GHA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::GHA_TOKEN missing; skip Gate N1 supersede-close"
            exit 0
          fi
          gh auth setup-git
          args=(--remote --close-superseded)
          if [[ -n "${{ inputs.repo }}" ]]; then
            args+=(--repo "${{ inputs.repo }}")
          fi
          bash bump-cloudflare-dependencies/bump-cloudflare-npm-deps.sh "${args[@]}" | tee -a bump-cloudflare-deps.log

      - name: Summary
        if: always()
        run: |
          echo "## bump-cloudflare-deps summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f bump-cloudflare-deps.log ]]; then
            echo "### Skipped / blocked" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(SKIP |BLOCK |BLOCK_REASON |GATE_N1 |SUPERSEDE_|remote summary:|remote close-superseded:)' bump-cloudflare-deps.log >> "$GITHUB_STEP_SUMMARY" || echo "(none)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Log tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 bump-cloudflare-deps.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on failure
        if: failure()
        uses: workers-world/action-notify-email@v1
        with:
          subject: "worker-support: bump-cloudflare-deps 失败"
          body: |
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dedup-key: bump-cloudflare-deps-fail-${{ github.run_id }}
          fail-on-error: false
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}

      - name: Notify summary
        if: success()
        uses: workers-world/action-notify-email@v1
        with:
          subject: "worker-support: bump-cloudflare-deps 完成"
          body: |
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            详细输出见 Actions 日志与本 workflow 的 Summary 步骤（含 bump-cloudflare-deps.log 末尾）。
          dedup-key: bump-cloudflare-deps-ok-${{ github.run_id }}
          fail-on-error: false
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
