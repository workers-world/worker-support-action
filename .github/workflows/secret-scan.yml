# Weekly gitleaks scan for workers-world public repos (full git history).
name: Secret scan

on:
  schedule:
    - cron: "0 5 * * 2"   # Tuesday 05:00 UTC
  workflow_dispatch:
    inputs:
      org:
        description: GitHub organization
        required: false
        default: workers-world
        type: string
      repo:
        description: Single repo (owner/name or short name with org)
        required: false
        default: ""
        type: string
      upload-artifact:
        description: Upload secrets-scan reports as artifact
        required: false
        default: true
        type: boolean
      create-issue:
        description: Open issue on worker-support-action when findings exist
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
          echo "GITLEAKS_BIN=/usr/local/bin/gitleaks" >> "$GITHUB_ENV"

      - name: Scan public repos
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_ORG: ${{ inputs.org || 'workers-world' }}
          INPUT_REPO: ${{ inputs.repo || '' }}
          INPUT_VISIBILITY: public
          INPUT_EXCLUDE_FILE: secret-scan/exclude-secrets.txt
          INPUT_CREATE_ISSUE: ${{ (github.event_name == 'workflow_dispatch' && inputs.create-issue == false) && 'false' || 'true' }}
          ISSUE_REPO: workers-world/worker-support-action
        run: |
          set +e
          bash secret-scan/scan-secrets.sh | tee secret-scan.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -f .scan-meta.json ]; then
            echo "missing .scan-meta.json" >&2
            exit 1
          fi
          finding_count="$(python3 -c 'import json; print(json.load(open(".scan-meta.json"))["finding-count"])')"
          echo "finding_count=$finding_count" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summary
        if: always()
        run: |
          echo "## secret-scan summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f secrets-scan.md ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -80 secrets-scan.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare notify findings body
        id: notify_findings
        if: steps.scan.outputs.finding_count != '0' && steps.scan.outputs.finding_count != ''
        run: |
          set -euo pipefail
          delim="notify_body_${RANDOM}_${RANDOM}_${RANDOM}"
          {
            printf 'body<<%s\n' "$delim"
            if [[ -f secrets-scan.md ]]; then
              head -150 secrets-scan.md
            else
              echo '(secrets-scan.md missing — see Actions artifact and run log)'
            fi
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on findings
        if: steps.scan.outputs.finding_count != '0' && steps.scan.outputs.finding_count != ''
        uses: workers-world/action-notify-email@v1
        with:
          subject: "worker-support: secret scan — ${{ steps.scan.outputs.finding_count }} finding(s)"
          body: ${{ steps.notify_findings.outputs.body }}
          dedup-key: secret-scan-findings-${{ github.run_id }}
          fail-on-error: false
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}

      - name: Notify on failure
        if: failure() && steps.scan.outputs.finding_count == '0'
        uses: workers-world/action-notify-email@v1
        with:
          subject: "worker-support: secret scan 失败"
          body: |
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dedup-key: secret-scan-fail-${{ github.run_id }}
          fail-on-error: false
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}

      - name: Upload scan reports
        if: always() && steps.scan.outputs.finding_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.upload-artifact != false)
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.run_id }}
          path: |
            secrets-scan.json
            secrets-scan.md
          if-no-files-found: error
