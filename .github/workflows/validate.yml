name: Validate action

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["dev_*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check scripts and workflows
        run: |
          set -euo pipefail
          test -x bump-worker-compat-date.sh
          test -x bump-cloudflare-npm-deps.sh
          test -f cloudflare-npm-deps.allowlist
          test -f .bump-cloudflare-npm-deps-lib.mjs
          test -f check-config-drift-remote.sh
          test -x scan-secrets.sh
          bash -n bump-worker-compat-date.sh
          bash -n bump-cloudflare-npm-deps.sh
          bash -n check-config-drift-remote.sh
          bash -n scan-secrets.sh
          python3 -m py_compile scan-secrets.py
          test -f .github/workflows/bump-compat-date.yml
          test -f .github/workflows/bump-cloudflare-deps.yml
          test -f .github/workflows/config-drift.yml
          test -f .github/workflows/secret-scan.yml
          test -f gitleaks.toml
